<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContextOS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f8;
      color: #202123;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .status {
      font-size: 13px;
      color: #16a34a;
    }

    .main-layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .sidebar {
      width: 260px;
      background: white;
      border-right: 1px solid #e5e5e5;
      padding: 20px 12px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      margin: 0 10px 12px;
    }

    .document-item {
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .document-item:hover {
      background: #f3f3f3;
    }

    .document-item.active {
      background: #111;
      color: white;
    }

    .document-item.active:hover {
      background: #111;
    }

    .documents-loading {
      padding: 10px;
      font-size: 13px;
      color: #999;
    }

    /* Chat */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px 140px;
    }

    .chat-inner {
      max-width: 800px;
      margin: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 80px;
      margin-bottom: 50px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #777;
    }

    .message {
      margin-bottom: 28px;
    }

    .message-label {
      font-size: 12px;
      font-weight: bold;
      color: #888;
      margin-bottom: 8px;
    }

    .bubble {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #e9e9eb;
      padding: 12px 16px;
      border-radius: 14px;
      display: inline-block;
      max-width: 80%;
    }

    .assistant .bubble {
      background: white;
      border: 1px solid #e5e5e5;
      padding: 16px;
      border-radius: 14px;
    }

    /* Sources */
    .sources {
      margin-top: 14px;
    }

    .sources-title {
      font-size: 12px;
      font-weight: bold;
      color: #777;
      margin-bottom: 8px;
    }

    .source {
      background: #f7f7f8;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .source-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .source-preview {
      color: #666;
      line-height: 1.4;
    }

    /* Input */
    .input-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(
        to top,
        #f7f7f8 70%,
        rgba(247,247,248,0)
      );
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    #question {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px;
      font-size: 15px;
      background: transparent;
    }

    #sendButton {
      border: none;
      background: #111;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #sendButton:hover {
      background: #333;
    }

    #sendButton:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }

    .error {
      color: #dc2626;
    }

    #uploadButton {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    #uploadButton:hover {
      background: #f3f3f3;
    }

    #uploadButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">ContextOS</div>
    <div style="display:flex; gap:12px; align-items:center;">
      <span class="status">● Backend connected</span>

      <input
        type="file"
        id="pdfInput"
        accept="application/pdf"
        hidden
      />

      <button id="uploadButton">
        + Upload PDF
      </button>
    </div>
  </header>

  <div class="main-layout">

    <aside class="sidebar">
      <div class="sidebar-title">Documents</div>
      <div id="documentList">
        <div class="documents-loading">Loading...</div>
      </div>
    </aside>

    <main class="chat" id="chat">
      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">
          <h1>Your Context, Remembered.</h1>
          <p>Ask questions across your documents and memories.</p>
        </div>

      </div>
    </main>

  </div>

  <div class="input-wrapper">
    <div class="input-box">
      <input
        id="question"
        type="text"
        placeholder="Ask ContextOS anything..."
        autocomplete="off"
      />

      <button id="sendButton">
        Send
      </button>
    </div>
  </div>

</div>

<script>
  const API_URL = "http://127.0.0.1:8000";

  // Use your existing test session for now.
  // Later we'll create sessions automatically.
  let sessionId = "a4362653-9065-4105-b858-822fb287234c";
  let selectedDocumentId = null;

  const questionInput = document.getElementById("question");
  const sendButton = document.getElementById("sendButton");
  const chatInner = document.getElementById("chatInner");
  const chat = document.getElementById("chat");
  const pdfInput = document.getElementById("pdfInput");
  const uploadButton = document.getElementById("uploadButton");
  const documentList = document.getElementById("documentList");


  async function loadDocuments() {
    try {
      const response = await fetch(`${API_URL}/documents`);

      if (!response.ok) {
        throw new Error("Failed to load documents");
      }

      const data = await response.json();

      documentList.innerHTML = "";

      const allItem = document.createElement("div");

      allItem.className =
        "document-item" +
        (selectedDocumentId === null ? " active" : "");

      allItem.textContent = "📚 All Documents";

      allItem.addEventListener("click", () => {
        selectedDocumentId = null;
        loadDocuments();
      });

      documentList.appendChild(allItem);

      if (!data.documents.length) {
        const empty = document.createElement("div");
        empty.className = "documents-loading";
        empty.textContent = "No documents yet";
        documentList.appendChild(empty);
        return;
      }

      data.documents.forEach(doc => {
        const item = document.createElement("div");

        item.className =
          "document-item" +
          (selectedDocumentId === doc.id ? " active" : "");

        item.textContent = `📄 ${doc.title}`;
        item.title = doc.filename || doc.title;

        item.addEventListener("click", () => {
          selectedDocumentId = doc.id;
          loadDocuments();
        });

        documentList.appendChild(item);
      });

    } catch (error) {
      console.error(error);

      documentList.innerHTML =
        `<div class="documents-loading">Could not load documents</div>`;
    }
  }


  function removeWelcome() {
    const welcome = document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }
  }


  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }


  function addUserMessage(text) {
    const message = document.createElement("div");

    message.className = "message user";

    message.innerHTML = `
      <div class="message-label">YOU</div>
      <div class="bubble"></div>
    `;

    message.querySelector(".bubble").textContent = text;

    chatInner.appendChild(message);

    scrollToBottom();
  }


  function addLoadingMessage() {
    const message = document.createElement("div");

    message.className = "message assistant";
    message.id = "loadingMessage";

    message.innerHTML = `
      <div class="message-label">CONTEXTOS</div>
      <div class="bubble loading">
        Thinking...
      </div>
    `;

    chatInner.appendChild(message);

    scrollToBottom();
  }


  function removeLoadingMessage() {
    const loading = document.getElementById("loadingMessage");

    if (loading) {
      loading.remove();
    }
  }


  function addAssistantMessage(answer, sources = []) {
    const message = document.createElement("div");

    message.className = "message assistant";

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = "CONTEXTOS";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = answer;

    message.appendChild(label);
    message.appendChild(bubble);


    if (sources.length > 0) {

      const sourcesContainer = document.createElement("div");
      sourcesContainer.className = "sources";

      const sourcesTitle = document.createElement("div");
      sourcesTitle.className = "sources-title";
      sourcesTitle.textContent = "Sources";

      sourcesContainer.appendChild(sourcesTitle);


      sources.slice(0, 3).forEach(source => {

        const sourceElement = document.createElement("div");

        sourceElement.className = "source";

        const sourceName = document.createElement("div");
        sourceName.className = "source-name";

        sourceName.textContent =
          `📄 ${source.document} · ${Math.round(source.similarity * 100)}% match`;


        const preview = document.createElement("div");
        preview.className = "source-preview";

        preview.textContent = source.preview || "";


        sourceElement.appendChild(sourceName);
        sourceElement.appendChild(preview);

        sourcesContainer.appendChild(sourceElement);
      });


      message.appendChild(sourcesContainer);
    }


    chatInner.appendChild(message);

    scrollToBottom();
  }


  function addErrorMessage(text) {
    const message = document.createElement("div");

    message.className = "message assistant";

    message.innerHTML = `
      <div class="message-label">ERROR</div>
      <div class="bubble error"></div>
    `;

    message.querySelector(".bubble").textContent = text;

    chatInner.appendChild(message);

    scrollToBottom();
  }


  async function sendMessage() {

    const question = questionInput.value.trim();

    if (!question) {
      return;
    }


    removeWelcome();

    addUserMessage(question);

    questionInput.value = "";

    sendButton.disabled = true;

    addLoadingMessage();


    try {

      const response = await fetch(`${API_URL}/chat`, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          question: question,
          session_id: sessionId,
          document_id: selectedDocumentId,
          limit: 5
        })
      });


      if (!response.ok) {
        throw new Error(
          `Backend returned ${response.status}`
        );
      }


      const data = await response.json();

      removeLoadingMessage();


      if (data.session_id) {
        sessionId = data.session_id;
      }


      addAssistantMessage(
        data.answer,
        data.sources || []
      );

    }

    catch (error) {

      removeLoadingMessage();

      console.error(error);

      addErrorMessage(
        "Could not connect to the ContextOS backend."
      );
    }

    finally {

      sendButton.disabled = false;

      questionInput.focus();
    }
  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  questionInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );


  uploadButton.addEventListener("click", () => {
    pdfInput.click();
  });


  pdfInput.addEventListener("change", async () => {
    const file = pdfInput.files[0];

    if (!file) return;

    const formData = new FormData();
    formData.append("file", file);

    removeWelcome();

    uploadButton.disabled = true;
    uploadButton.textContent = "Uploading...";

    try {
      const response = await fetch(
        `${API_URL}/documents/upload`,
        {
          method: "POST",
          body: formData
        }
      );

      if (!response.ok) {
        throw new Error(`Upload failed: ${response.status}`);
      }

      const data = await response.json();

      await loadDocuments();

      uploadButton.textContent = "Uploaded ✓";

      addAssistantMessage(
        `Document "${data.document.title}" is ready. You can ask questions about it now.`,
        []
      );

    } catch (error) {
      console.error(error);

      uploadButton.textContent = "Upload failed";

      addErrorMessage(
        "Could not upload the document."
      );

    } finally {
      setTimeout(() => {
        uploadButton.disabled = false;
        uploadButton.textContent = "+ Upload PDF";
        pdfInput.value = "";
      }, 2000);
    }
  });


  loadDocuments();

</script>

</body>
</html>
