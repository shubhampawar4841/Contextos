<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContextOS</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f8;
      color: #202123;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .status {
      font-size: 13px;
      color: #16a34a;
    }

    .main-layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .sidebar {
      width: 260px;
      background: white;
      border-right: 1px solid #e5e5e5;
      padding: 20px 12px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      margin: 0 10px 12px;
    }

    .document-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .document-item span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .document-item:hover {
      background: #f3f3f3;
    }

    .document-item.active {
      background: #111;
      color: white;
    }

    .document-item.active:hover {
      background: #111;
    }

    .delete-document {
      border: none;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      opacity: 0;
      color: inherit;
      line-height: 1;
    }

    .document-item:hover .delete-document {
      opacity: 0.6;
    }

    .delete-document:hover {
      opacity: 1 !important;
    }

    .documents-loading {
      padding: 10px;
      font-size: 13px;
      color: #999;
    }

    /* Chat */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px 140px;
    }

    .chat-inner {
      max-width: 800px;
      margin: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 80px;
      margin-bottom: 50px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #777;
    }

    .message {
      margin-bottom: 28px;
    }

    .message-label {
      font-size: 12px;
      font-weight: bold;
      color: #888;
      margin-bottom: 8px;
    }

    .bubble {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #e9e9eb;
      padding: 12px 16px;
      border-radius: 14px;
      display: inline-block;
      max-width: 80%;
    }

    .assistant .bubble {
      background: white;
      border: 1px solid #e5e5e5;
      padding: 16px;
      border-radius: 14px;
    }

    /* Sources */
    .sources {
      margin-top: 14px;
    }

    .sources-title {
      font-size: 12px;
      font-weight: bold;
      color: #777;
      margin-bottom: 8px;
    }

    .source {
      background: #f7f7f8;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .source-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .source-preview {
      color: #666;
      line-height: 1.4;
    }

    /* Input */
    .input-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(
        to top,
        #f7f7f8 70%,
        rgba(247,247,248,0)
      );
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    #question {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px;
      font-size: 15px;
      background: transparent;
    }

    #sendButton {
      border: none;
      background: #111;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #sendButton:hover {
      background: #333;
    }

    #sendButton:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }

    .error {
      color: #dc2626;
    }

    #uploadButton {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    #uploadButton:hover {
      background: #f3f3f3;
    }

    #uploadButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #newChatButton {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      font-weight: 600;
    }

    #newChatButton:hover {
      background: #f3f3f3;
    }

    #contextButton {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
      font-weight: 600;
    }

    #contextButton:hover {
      background: #f3f3f3;
    }

    #graphButton {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
      font-weight: 600;
    }

    #graphButton:hover {
      background: #f3f3f3;
    }

    #graphPanel {
      flex: 1;
      padding: 24px;
      width: 100%;
      overflow: auto;
      background: #f7f7f8;
    }

    #knowledgeGraph {
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      display: block;
      max-width: 100%;
    }

    .graph-label {
      font-size: 12px;
      pointer-events: none;
    }

    .graph-link-label {
      font-size: 10px;
      fill: #777;
    }

    .graph-details {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
    }

    .graph-details h3 {
      margin-bottom: 10px;
    }

    .graph-details ul {
      padding-left: 18px;
    }

    .graph-details li {
      margin-bottom: 6px;
    }

    #contextPanel {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px 140px;
      background: #f7f7f8;
    }

    .context-inner {
      max-width: 800px;
      margin: auto;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 24px;
    }

    .context-inner h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .context-inner h3 {
      margin-top: 22px;
      margin-bottom: 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
    }

    .context-inner ul {
      list-style: none;
      padding: 0;
    }

    .context-inner li {
      padding: 10px 12px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fafafa;
      font-size: 14px;
      line-height: 1.5;
    }

    .chat-item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item:hover {
      background: #f3f3f3;
    }

    .chat-item.active {
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">ContextOS</div>
    <div style="display:flex; gap:12px; align-items:center;">
      <span class="status">● Backend connected</span>

      <input
        type="file"
        id="pdfInput"
        accept="application/pdf"
        hidden
      />

      <button id="uploadButton">
        + Upload PDF
      </button>
    </div>
  </header>

  <div class="main-layout">

    <aside class="sidebar">
      <button id="newChatButton">
        + New Chat
      </button>

      <button id="contextButton">
        Context
      </button>

      <button id="graphButton">
        Knowledge Graph
      </button>

      <div class="sidebar-title">Chats</div>
      <div id="chatList"></div>

      <div class="sidebar-title" style="margin-top: 24px;">Documents</div>
      <div id="documentList">
        <div class="documents-loading">Loading...</div>
      </div>
    </aside>

    <main class="chat" id="chat">
      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">
          <h1>Your Context, Remembered.</h1>
          <p>Ask questions across your documents and memories.</p>
        </div>

      </div>
    </main>

    <div id="contextPanel" style="display:none;"></div>

    <div id="graphPanel" style="display:none;">
      <h2 style="margin-bottom: 16px;">Knowledge Graph</h2>
      <svg id="knowledgeGraph" width="900" height="520"></svg>
      <div id="graphDetails" class="graph-details">
        <h3>Select a node</h3>
        <p>Click any node to inspect its relationships.</p>
      </div>
    </div>

  </div>

  <div class="input-wrapper">
    <div class="input-box">
      <input
        id="question"
        type="text"
        placeholder="Ask ContextOS anything..."
        autocomplete="off"
      />

      <button id="sendButton">
        Send
      </button>
    </div>
  </div>

</div>

<script>
  const API_URL = "http://127.0.0.1:8000";

  let sessionId = null;
  let selectedDocumentId = null;
  let contextMemories = [];

  const questionInput = document.getElementById("question");
  const sendButton = document.getElementById("sendButton");
  const chatInner = document.getElementById("chatInner");
  const chat = document.getElementById("chat");
  const pdfInput = document.getElementById("pdfInput");
  const uploadButton = document.getElementById("uploadButton");
  const documentList = document.getElementById("documentList");
  const chatList = document.getElementById("chatList");
  const newChatButton = document.getElementById("newChatButton");
  const contextButton = document.getElementById("contextButton");
  const contextPanel = document.getElementById("contextPanel");
  const graphButton = document.getElementById("graphButton");
  const graphPanel = document.getElementById("graphPanel");


  async function loadDocuments() {
    try {
      const response = await fetch(`${API_URL}/documents`);

      if (!response.ok) {
        throw new Error("Failed to load documents");
      }

      const data = await response.json();

      documentList.innerHTML = "";

      const allItem = document.createElement("div");

      allItem.className =
        "document-item" +
        (selectedDocumentId === null ? " active" : "");

      allItem.textContent = "📚 All Documents";

      allItem.addEventListener("click", () => {
        selectedDocumentId = null;
        loadDocuments();
      });

      documentList.appendChild(allItem);

      if (!data.documents.length) {
        const empty = document.createElement("div");
        empty.className = "documents-loading";
        empty.textContent = "No documents yet";
        documentList.appendChild(empty);
        return;
      }

      data.documents.forEach(doc => {
        const item = document.createElement("div");

        item.className =
          "document-item" +
          (selectedDocumentId === doc.id ? " active" : "");

        const name = document.createElement("span");
        name.textContent = `📄 ${doc.title} · ${doc.status || "unknown"}`;
        name.title = doc.filename || doc.title;

        name.addEventListener("click", () => {
          selectedDocumentId = doc.id;
          loadDocuments();
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "×";
        deleteButton.className = "delete-document";

        deleteButton.addEventListener("click", async (event) => {
          event.stopPropagation();

          const shouldDelete = confirm(
            `Delete "${doc.title}"?`
          );

          if (!shouldDelete) return;

          try {
            const response = await fetch(
              `${API_URL}/documents/${doc.id}`,
              {
                method: "DELETE"
              }
            );

            if (!response.ok) {
              throw new Error("Delete failed");
            }

            if (selectedDocumentId === doc.id) {
              selectedDocumentId = null;
            }

            await loadDocuments();

          } catch (error) {
            console.error(error);
            alert("Could not delete document");
          }
        });

        item.appendChild(name);
        item.appendChild(deleteButton);

        documentList.appendChild(item);
      });

    } catch (error) {
      console.error(error);

      documentList.innerHTML =
        `<div class="documents-loading">Could not load documents</div>`;
    }
  }


  function showChatView() {
    chat.style.display = "block";
    contextPanel.style.display = "none";
    graphPanel.style.display = "none";
  }


  function showContextView() {
    chat.style.display = "none";
    contextPanel.style.display = "block";
    graphPanel.style.display = "none";
  }


  function showGraphView() {
    chat.style.display = "none";
    contextPanel.style.display = "none";
    graphPanel.style.display = "block";
  }


  async function loadContext() {
    try {
      showContextView();

      contextPanel.innerHTML = `
        <div class="context-inner">
          <h2>Context</h2>
          <p style="color:#888;">Loading...</p>
        </div>
      `;

      const response = await fetch(`${API_URL}/context`);

      if (!response.ok) {
        throw new Error("Failed to load context");
      }

      const data = await response.json();

      const memories = data.memories || [];
      const entities = data.entities || [];
      const relationships = data.relationships || [];
      const documents = data.documents || [];

      contextPanel.innerHTML = `
        <div class="context-inner">
          <h2>Context</h2>

          <h3>Memories</h3>
          <ul>
            ${
              memories.length
                ? memories
                    .map(m => `<li>${escapeHtml(m.content)}</li>`)
                    .join("")
                : "<li>No memories yet</li>"
            }
          </ul>

          <h3>Entities</h3>
          <ul>
            ${
              entities.length
                ? entities
                    .map(
                      e =>
                        `<li>${escapeHtml(e.name)} · ${escapeHtml(e.entity_type)}</li>`
                    )
                    .join("")
                : "<li>No entities yet</li>"
            }
          </ul>

          <h3>Relationships</h3>
          <ul>
            ${
              relationships.length
                ? relationships
                    .map(r => {
                      const source = r.source?.name || "?";
                      const target = r.target?.name || "?";
                      return `<li>${escapeHtml(source)} → ${escapeHtml(r.relationship)} → ${escapeHtml(target)}</li>`;
                    })
                    .join("")
                : "<li>No relationships yet</li>"
            }
          </ul>

          <h3>Documents</h3>
          <ul>
            ${
              documents.length
                ? documents
                    .map(
                      d =>
                        `<li>${escapeHtml(d.title)} · ${escapeHtml(d.status || "unknown")}</li>`
                    )
                    .join("")
                : "<li>No documents yet</li>"
            }
          </ul>
        </div>
      `;
    } catch (error) {
      console.error(error);

      contextPanel.innerHTML = `
        <div class="context-inner">
          <h2>Context</h2>
          <p class="error">Could not load context.</p>
        </div>
      `;
    }
  }


  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }


  function removeWelcome() {
    const welcome = document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }
  }


  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }


  function addUserMessage(text) {
    const message = document.createElement("div");

    message.className = "message user";

    message.innerHTML = `
      <div class="message-label">YOU</div>
      <div class="bubble"></div>
    `;

    message.querySelector(".bubble").textContent = text;

    chatInner.appendChild(message);

    scrollToBottom();
  }


  function addLoadingMessage() {
    const message = document.createElement("div");

    message.className = "message assistant";
    message.id = "loadingMessage";

    message.innerHTML = `
      <div class="message-label">CONTEXTOS</div>
      <div class="bubble loading">
        Thinking...
      </div>
    `;

    chatInner.appendChild(message);

    scrollToBottom();
  }


  function removeLoadingMessage() {
    const loading = document.getElementById("loadingMessage");

    if (loading) {
      loading.remove();
    }
  }


  function addAssistantMessage(answer, sources = []) {
    const message = document.createElement("div");

    message.className = "message assistant";

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = "CONTEXTOS";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = answer;

    message.appendChild(label);
    message.appendChild(bubble);


    if (sources.length > 0) {

      const sourcesContainer = document.createElement("div");
      sourcesContainer.className = "sources";

      const sourcesTitle = document.createElement("div");
      sourcesTitle.className = "sources-title";
      sourcesTitle.textContent = "Sources";

      sourcesContainer.appendChild(sourcesTitle);


      sources.slice(0, 3).forEach(source => {

        const sourceElement = document.createElement("div");

        sourceElement.className = "source";

        const sourceName = document.createElement("div");
        sourceName.className = "source-name";

        let pageText = "";

        if (source.page_start) {
          if (
            source.page_end &&
            source.page_end !== source.page_start
          ) {
            pageText = ` · Pages ${source.page_start}-${source.page_end}`;
          } else {
            pageText = ` · Page ${source.page_start}`;
          }
        }

        sourceName.textContent =
          `📄 ${source.document}${pageText} · ${Math.round(source.similarity * 100)}% match`;


        const preview = document.createElement("div");
        preview.className = "source-preview";

        preview.textContent = source.preview || "";


        sourceElement.appendChild(sourceName);
        sourceElement.appendChild(preview);

        sourcesContainer.appendChild(sourceElement);
      });


      message.appendChild(sourcesContainer);
    }


    chatInner.appendChild(message);

    scrollToBottom();
  }


  function addErrorMessage(text) {
    const message = document.createElement("div");

    message.className = "message assistant";

    message.innerHTML = `
      <div class="message-label">ERROR</div>
      <div class="bubble error"></div>
    `;

    message.querySelector(".bubble").textContent = text;

    chatInner.appendChild(message);

    scrollToBottom();
  }


  async function sendMessage() {

    const question = questionInput.value.trim();

    if (!question) {
      return;
    }

    showChatView();
    removeWelcome();

    addUserMessage(question);

    questionInput.value = "";

    sendButton.disabled = true;

    addLoadingMessage();


    try {

      const response = await fetch(`${API_URL}/chat`, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          question: question,
          session_id: sessionId,
          document_id: selectedDocumentId,
          limit: 5
        })
      });


      if (!response.ok) {
        throw new Error(
          `Backend returned ${response.status}`
        );
      }


      const data = await response.json();

      removeLoadingMessage();


      if (data.session_id) {
        sessionId = data.session_id;
        await loadSessions();
      }


      addAssistantMessage(
        data.answer,
        data.sources || []
      );

    }

    catch (error) {

      removeLoadingMessage();

      console.error(error);

      addErrorMessage(
        "Could not connect to the ContextOS backend."
      );
    }

    finally {

      sendButton.disabled = false;

      questionInput.focus();
    }
  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  questionInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );


  uploadButton.addEventListener("click", () => {
    pdfInput.click();
  });


  pdfInput.addEventListener("change", async () => {
    const file = pdfInput.files[0];

    if (!file) return;

    const formData = new FormData();
    formData.append("file", file);

    removeWelcome();

    uploadButton.disabled = true;
    uploadButton.textContent = "Uploading...";

    const poll = setInterval(loadDocuments, 2000);

    try {
      const response = await fetch(
        `${API_URL}/documents/upload`,
        {
          method: "POST",
          body: formData
        }
      );

      if (!response.ok) {
        throw new Error(`Upload failed: ${response.status}`);
      }

      const data = await response.json();

      await loadDocuments();

      uploadButton.textContent = "Uploaded ✓";

      addAssistantMessage(
        `Document "${data.document.title}" is ready. You can ask questions about it now.`,
        []
      );

    } catch (error) {
      console.error(error);

      uploadButton.textContent = "Upload failed";

      await loadDocuments();

      addErrorMessage(
        "Could not upload the document."
      );

    } finally {
      clearInterval(poll);

      setTimeout(() => {
        uploadButton.disabled = false;
        uploadButton.textContent = "+ Upload PDF";
        pdfInput.value = "";
      }, 2000);
    }
  });


  loadDocuments();
  loadSessions();


  async function createNewChat() {
    try {
      showChatView();

      const response = await fetch(`${API_URL}/sessions`, {
        method: "POST"
      });

      if (!response.ok) {
        throw new Error("Failed to create session");
      }

      const session = await response.json();

      sessionId = session.id;

      chatInner.innerHTML = `
        <div class="welcome" id="welcome">
          <h1>Your Context, Remembered.</h1>
          <p>Ask questions across your documents and memories.</p>
        </div>
      `;

      await loadSessions();

      questionInput.focus();
    } catch (error) {
      console.error(error);
      addErrorMessage("Could not create a new chat.");
    }
  }


  async function loadSessions() {
    try {
      const response = await fetch(`${API_URL}/sessions`);

      if (!response.ok) {
        throw new Error("Failed to load sessions");
      }

      const data = await response.json();

      chatList.innerHTML = "";

      (data.sessions || []).forEach(session => {
        const item = document.createElement("div");

        item.className =
          "chat-item" +
          (sessionId === session.id ? " active" : "");

        item.textContent = session.title || "New Chat";

        item.addEventListener("click", async () => {
          sessionId = session.id;
          await loadSessionMessages(session.id);
          await loadSessions();
        });

        chatList.appendChild(item);
      });
    } catch (error) {
      console.error(error);
      chatList.innerHTML =
        `<div class="documents-loading">Could not load chats</div>`;
    }
  }


  async function loadSessionMessages(id) {
    try {
      showChatView();

      const response = await fetch(
        `${API_URL}/sessions/${id}/messages`
      );

      if (!response.ok) {
        throw new Error("Failed to load messages");
      }

      const data = await response.json();

      chatInner.innerHTML = "";

      if (!(data.messages || []).length) {
        chatInner.innerHTML = `
          <div class="welcome" id="welcome">
            <h1>Your Context, Remembered.</h1>
            <p>Ask questions across your documents and memories.</p>
          </div>
        `;
        return;
      }

      data.messages.forEach(message => {
        if (message.role === "user") {
          addUserMessage(message.content);
        } else {
          addAssistantMessage(message.content, []);
        }
      });
    } catch (error) {
      console.error(error);
      addErrorMessage("Could not load chat messages.");
    }
  }


  newChatButton.addEventListener(
    "click",
    createNewChat
  );


  contextButton.addEventListener(
    "click",
    loadContext
  );


  async function loadKnowledgeGraph() {
    try {
      showGraphView();

      const details = document.getElementById("graphDetails");
      if (details) {
        details.innerHTML = `
          <h3>Select a node</h3>
          <p>Click any node to inspect its relationships.</p>
        `;
      }

      const response = await fetch(`${API_URL}/context`);

      if (!response.ok) {
        throw new Error("Failed to load graph context");
      }

      const data = await response.json();

      contextMemories = data.memories || [];

      renderKnowledgeGraph(
        data.entities || [],
        data.relationships || []
      );
    } catch (error) {
      console.error(error);
      alert("Could not load knowledge graph");
    }
  }


  function renderKnowledgeGraph(entities, relationships) {
    const svg = d3.select("#knowledgeGraph");

    svg.selectAll("*").remove();

    const width = +svg.attr("width");
    const height = +svg.attr("height");

    if (!entities.length) {
      svg.append("text")
        .attr("x", width / 2)
        .attr("y", height / 2)
        .attr("text-anchor", "middle")
        .attr("fill", "#888")
        .text("No entities yet");
      return;
    }

    const nodes = entities.map(entity => ({
      id: entity.id,
      name: entity.name,
      type: entity.entity_type
    }));

    const links = relationships
      .map(rel => {
        const sourceName = rel.source?.name;
        const targetName = rel.target?.name;

        const source = nodes.find(
          node => node.name === sourceName
        );

        const target = nodes.find(
          node => node.name === targetName
        );

        if (!source || !target) {
          return null;
        }

        return {
          source: source.id,
          target: target.id,
          relationship: rel.relationship
        };
      })
      .filter(Boolean);

    const simulation = d3.forceSimulation(nodes)
      .force(
        "link",
        d3.forceLink(links)
          .id(d => d.id)
          .distance(140)
      )
      .force(
        "charge",
        d3.forceManyBody()
          .strength(-500)
      )
      .force(
        "center",
        d3.forceCenter(width / 2, height / 2)
      )
      .force(
        "collision",
        d3.forceCollide(55)
      );

    const link = svg.append("g")
      .selectAll("line")
      .data(links)
      .join("line")
      .attr("stroke", "#bbb")
      .attr("stroke-width", 2);

    const linkLabels = svg.append("g")
      .selectAll("text")
      .data(links)
      .join("text")
      .attr("class", "graph-link-label")
      .text(d => d.relationship);

    const node = svg.append("g")
      .selectAll("g")
      .data(nodes)
      .join("g")
      .style("cursor", "pointer")
      .call(
        d3.drag()
          .on("start", dragStarted)
          .on("drag", dragged)
          .on("end", dragEnded)
      );

    node.on("click", function(event, d) {
      event.stopPropagation();

      showNodeDetails(
        d,
        relationships
      );
    });

    node.append("circle")
      .attr("r", 34)
      .attr("fill", d => {
        if (d.type === "project") return "#111";
        if (d.type === "technology") return "#4f46e5";
        if (d.type === "person") return "#059669";
        return "#666";
      });

    node.append("text")
      .attr("text-anchor", "middle")
      .attr("dy", 4)
      .attr("fill", "white")
      .attr("class", "graph-label")
      .text(d => d.name);

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      linkLabels
        .attr(
          "x",
          d => (d.source.x + d.target.x) / 2
        )
        .attr(
          "y",
          d => (d.source.y + d.target.y) / 2
        );

      node.attr(
        "transform",
        d => `translate(${d.x},${d.y})`
      );
    });

    function dragStarted(event, d) {
      if (!event.active) {
        simulation.alphaTarget(0.3).restart();
      }

      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragEnded(event, d) {
      if (!event.active) {
        simulation.alphaTarget(0);
      }

      d.fx = null;
      d.fy = null;
    }
  }


  function showNodeDetails(node, relationships) {
    const details = document.getElementById("graphDetails");

    const related = relationships.filter(rel => {
      return (
        rel.source?.name === node.name ||
        rel.target?.name === node.name
      );
    });

    let relationshipsHtml = "";

    if (related.length === 0) {
      relationshipsHtml = "<li>No relationships found</li>";
    } else {
      relationshipsHtml = related.map(rel => {
        if (rel.source.name === node.name) {
          return `
            <li>
              ${escapeHtml(node.name)}
              → ${escapeHtml(rel.relationship)}
              → ${escapeHtml(rel.target.name)}
            </li>
          `;
        }

        return `
          <li>
            ${escapeHtml(rel.source.name)}
            → ${escapeHtml(rel.relationship)}
            → ${escapeHtml(node.name)}
          </li>
        `;
      }).join("");
    }

    const relatedMemories = contextMemories.filter(memory =>
      memory.content
        .toLowerCase()
        .includes(node.name.toLowerCase())
    );

    let memoriesHtml = "";

    if (relatedMemories.length === 0) {
      memoriesHtml = "<li>No related memories</li>";
    } else {
      memoriesHtml = relatedMemories
        .map(memory => `
          <li>
            ${escapeHtml(memory.content)}
          </li>
        `)
        .join("");
    }

    details.innerHTML = `
      <h3>${escapeHtml(node.name)}</h3>

      <p>
        <strong>Type:</strong>
        ${escapeHtml(node.type)}
      </p>

      <br>

      <strong>Relationships</strong>

      <ul>
        ${relationshipsHtml}
      </ul>

      <br>

      <strong>Related Memories</strong>

      <ul>
        ${memoriesHtml}
      </ul>
    `;
  }


  graphButton.addEventListener(
    "click",
    loadKnowledgeGraph
  );

</script>
